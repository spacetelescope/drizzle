[project]
name = "drizzle"
description = "A package for combining dithered images into a single image"
requires-python = ">=3.11"
authors = [
    { name = "STScI" },
]
dependencies = [
    "numpy",
]
license-files = ["LICENSE.rst"]
dynamic = [
    "version",
]

[project.readme]
file = "README.rst"
content-type = "text/x-rst"

[project.urls]
Homepage = "https://github.com/spacetelescope/drizzle"
"Bug Tracker" = "https://github.com/spacetelescope/drizzle/issues"
Documentation = "http://spacetelescope.github.io/drizzle/"
"Source Code" = "https://github.com/spacetelescope/drizzle"

[project.optional-dependencies]
test = [
    "astropy",
    "coverage",
    "gwcs",
    "pytest>=9.0",
    "pytest-cov",
    "pytest-doctestplus",
]
docs = [
    "sphinx",
    "sphinx-automodapi",
    "sphinx-rtd-theme",
    "matplotlib",
    "pytest-doctestplus",
]

[build-system]
requires = [
    "setuptools>=61.2",
    "setuptools_scm[toml]>=3.4",
    "numpy>=2.0.1",
]
build-backend = "setuptools.build_meta"

[tool.cibuildwheel]
build = [
    "cp311-*",  # build for CPython 3.11 Stable API
    "cp3*t-*"  # also build free-threaded wheels
]
test-command = 'python -c "from drizzle import cdrizzle"'

[tool.setuptools]
zip-safe = false
include-package-data = false

[tool.setuptools.packages.find]
namespaces = false

[tool.pytest]
minversion = "9.0"
norecursedirs = [
    "build",
    "docs/_build",
]

[tool.setuptools_scm]

[tool.coverage.run]
omit = [
    "drizzle/__init__*",
    "drizzle/**/conftest.py",
    "drizzle/**/setup*",
    "drizzle/**/tests/*",
    "drizzle/version*",
    "drizzle/_version.py",
    "*/drizzle/__init__*",
    "*/drizzle/**/conftest.py",
    "*/drizzle/**/setup*",
    "*/drizzle/**/tests/*",
]

[tool.coverage.report]
exclude_lines = [
    # Have to re-enable the standard pragma
    "pragma: no cover",
    # Don't complain about packages we have installed
    "except ImportError",
    # Don't complain if tests don't hit defensive assertion code:
    "raise AssertionError",
    "raise NotImplementedError",
    # Don't complain about script hooks
    "'def main(.*):'",
    # Ignore branches that don't pertain to this version of Python
    "pragma: py{ignore_python_version}",
]
