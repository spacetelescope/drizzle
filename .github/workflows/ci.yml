name: CI

on:
  push:
    branches:
      - main
      - '*.x'
    tags:
      - "*"
  pull_request:
  schedule:
    - cron: '0 6 * * 1'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    uses: OpenAstronomy/github-actions-workflows/.github/workflows/tox.yml@3a3dcf3ba6828dac29eba10334948ef38364ed14  # v3.1.0
    permissions:
      id-token: write
    with:
      envs: |
        - linux: check-style
        - linux: check-security
        - linux: py311-xdist
        - linux: py312-xdist
        - linux: py313-xdist
        - linux: py314-xdist
        - linux: py315-cov-xdist
          coverage: codecov-oidc
        # Cannot use Python 3.13.4, see https://github.com/python/cpython/issues/135151
        - macos: py313-xdist
        - macos: py315-xdist
        - windows: py313-xdist
        - windows: py315-xdist
        - linux: py315-devdeps-xdist
      toxdeps: tox-uv
